name: Build and publish image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go adapter
        run: go test ./...
      - name: Build local image
        run: docker build --platform linux/amd64 -t ghcr.io/yude/pix-userland-mirakc-tuner:main .
      - name: Test mirakc HTTP path with synthetic TS
        env:
          MIRAKC_TEST_IMAGE: ghcr.io/yude/pix-userland-mirakc-tuner:main
        run: python3 tests/docker_smoke.py
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ghcr.io/yude/pix-userland-mirakc-tuner:main \
            ghcr.io/yude/pix-userland-mirakc-tuner:sha-${GITHUB_SHA}
          docker push ghcr.io/yude/pix-userland-mirakc-tuner:main
          docker push ghcr.io/yude/pix-userland-mirakc-tuner:sha-${GITHUB_SHA}
