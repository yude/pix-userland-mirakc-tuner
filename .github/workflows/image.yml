name: Build and publish image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Test Go adapter
        run: go test ./...

  image:
    needs: unit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            suffix: armv7
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.suffix == 'armv7'
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v3
      - name: Build platform image
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TAG_SUFFIX: ${{ matrix.suffix }}
        run: |
          docker buildx build --pull --platform "$TARGET_PLATFORM" --load \
            -t "ghcr.io/yude/pix-userland-mirakc-tuner:test-${TAG_SUFFIX}" .
      - name: Test mirakc HTTP path with synthetic TS
        env:
          MIRAKC_TEST_IMAGE: ghcr.io/yude/pix-userland-mirakc-tuner:test-${{ matrix.suffix }}
          MIRAKC_TEST_PLATFORM: ${{ matrix.platform }}
        run: python3 tests/docker_smoke.py
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested platform image
        if: github.event_name != 'pull_request'
        env:
          TAG_SUFFIX: ${{ matrix.suffix }}
        run: |
          image=ghcr.io/yude/pix-userland-mirakc-tuner
          docker tag "${image}:test-${TAG_SUFFIX}" "${image}:sha-${GITHUB_SHA}-${TAG_SUFFIX}"
          docker push "${image}:sha-${GITHUB_SHA}-${TAG_SUFFIX}"

  manifest:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          image=ghcr.io/yude/pix-userland-mirakc-tuner
          docker buildx imagetools create \
            -t "${image}:main" -t "${image}:sha-${GITHUB_SHA}" \
            "${image}:sha-${GITHUB_SHA}-amd64" \
            "${image}:sha-${GITHUB_SHA}-arm64" \
            "${image}:sha-${GITHUB_SHA}-armv7"
      - name: Verify published platforms
        run: |
          docker buildx imagetools inspect --raw \
            ghcr.io/yude/pix-userland-mirakc-tuner:main |
            python3 -c 'import json, sys; m = json.load(sys.stdin)["manifests"]; p = {(v["platform"]["os"], v["platform"]["architecture"], v["platform"].get("variant", "")) for v in m}; assert ("linux", "amd64", "") in p and any(x[:2] == ("linux", "arm64") for x in p) and ("linux", "arm", "v7") in p, p; print(sorted(p))'
